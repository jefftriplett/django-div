# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Zensical is not first-class on Read the Docs, so it runs through build.jobs:
# https://docs.readthedocs.com/platform/latest/intro/zensical.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # scripts/gen_llms.py runs django_div over the rendered site, so the
      # package itself is a docs dependency, markdown extra included.
      - pip install zensical ".[markdown]"
    build:
      html:
        - zensical build --clean --strict
        # Zensical has no plugin API yet, so llms.txt, llms-full.txt and the
        # per-page .md twins are generated from the rendered output here.
        - python scripts/gen_llms.py site
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
