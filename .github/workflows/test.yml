name: test

on:
  push:
    branches: [main]
  pull_request:

# nothing here writes to the repository; release.yml grants its own token
permissions: {}

jobs:
  test:
    name: test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # every Python on the newest Django, plus every Django on the oldest
      # Python, rather than the full cross product
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        django-version: ["6.1"]
        include:
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv pip install "django~=${{ matrix.django-version }}.0"
      - run: uv run --no-sync python -m django --version
      - run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run prek run --all-files
