name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v5
      # lxml has no wheels for prerelease Pythons yet; build it from source
      - name: Install libxml2/libxslt headers
        if: startsWith(matrix.python-version, '3.15')
        run: sudo apt-get update && sudo apt-get install --yes libxml2-dev libxslt1-dev
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run prek run --all-files
